[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "CRANE"
version = "0.1.0"
description = "The Cognitive Retrieval Augmented Neural Engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pyyaml>=6",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "neo4j>=5.20",
  "tokenizers>=0.20",
  "python-dotenv>=1.0",
  "tensorboard>=2.14",
  "numpy>=2.0",
]

[project.scripts]
generate-init = "cli.scripts.generate_inits:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["crane", "cli", "pipelines"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
